name: CI

# VibePiik: build and test the Windows App on every push and pull request.
# (Piik's own release, website and mirror automation is not used here:
# VibePiik releases are published by hand.)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Build web pages (embedded in the App)
        run: |
          npm ci --ignore-scripts
          npm run build:web
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./cmd/... ./internal/app/... ./internal/piiktv/...
      - name: Test
        run: go test ./internal/app/... ./internal/piiktv/...
      - name: Build piik-app.exe
        run: go build -trimpath -o piik-app.exe ./cmd/piik-app